{
  "name": "review-cashflow-forecast-assumption-reviewer",
  "description": "Run Cashflow Forecast Assumption Reviewer",
  "version": "0.1.0",
  "input_schema": {
    "type": "object",
    "properties": {
      "payload": {
        "type": "object",
        "properties": {
          "forecast_periods": {
            "type": "array",
            "description": "forecast periods"
          },
          "assumptions": {
            "type": "array",
            "description": "assumptions"
          },
          "scenario_label": {
            "type": "string",
